<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Anuncios UAB</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Anuncios UAB</a>
      <div>
        <button id="loginBtn" class="btn btn-outline-light btn-sm">Login</button>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm" style="display: none;">
          Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="h3 mb-3">Listado de anuncios</h1>
    <p class="text-muted">
      Ejemplo: Taller de Bases de Datos y otros anuncios creados.
    </p>
    <p id="adsError" class="text-danger"></p>

    <div id="adsContainer" class="row g-3 mb-5">
      <!-- Aquí se cargan las tarjetas de anuncios -->
    </div>

    <h2 class="h4 mt-4">Crear nuevo anuncio</h2>
    <p>Solo disponible si has iniciado sesión.</p>

    <!-- Sección crear anuncio (oculta por defecto) -->
    <div id="createSection" style="display: none;">
      <form id="adForm" class="card p-3 mt-2">
        <div class="mb-3">
          <label class="form-label" for="titulo">Título</label>
          <input type="text" id="titulo" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="descripcion">Descripción</label>
          <textarea id="descripcion" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label" for="categoria">Categoría</label>
          <input type="text" id="categoria" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="precio">Precio (opcional)</label>
          <input type="number" id="precio" class="form-control" min="0">
        </div>

        <button type="submit" class="btn btn-success">Publicar anuncio</button>
        <p id="adMessage" class="mt-2 text-danger"></p>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
