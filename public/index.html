<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Anuncios UAB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Anuncios UAB</a>
      <div class="d-flex">
        <a id="btnLogin" href="login.html" class="btn btn-outline-light me-2">Login</a>
        <button id="btnLogout" class="btn btn-outline-light d-none">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="mb-3">Listado de anuncios</h1>
    <p class="text-muted">Ejemplo: Taller de Bases de Datos y otros anuncios creados.</p>

    <div id="adsList" class="row g-3 mb-5">
      <!-- Aquí se insertan las tarjetas de anuncios desde app.js -->
    </div>

    <hr>

    <h2 class="mb-3">Crear nuevo anuncio</h2>
    <p class="text-muted">Solo disponible si has iniciado sesión.</p>

    <form id="adForm" class="card p-3">
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" id="titulo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea id="descripcion" class="form-control" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <input type="text" id="categoria" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Precio (opcional)</label>
        <input type="number" id="precio" class="form-control" min="0">
      </div>
      <button type="submit" class="btn btn-primary">Publicar anuncio</button>
      <p id="adMessage" class="mt-2 text-danger"></p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
