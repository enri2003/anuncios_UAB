<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Anuncios UAB</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4" style="max-width: 400px; width: 100%;">
      <h1 class="h4 mb-3 text-center">Crear cuenta</h1>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Registrarse</button>
        <p id="registerMessage" class="mt-2 text-danger text-center"></p>
      </form>

      <a href="login.html" class="d-block text-center mt-3">
        ¿Ya tienes cuenta? Inicia sesión
      </a>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('registerMessage');
      msg.textContent = '';

      try {
        const resp = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });

        const data = await resp.json();

        if (!resp.ok) {
          msg.textContent = data.mensaje || 'Error al registrar usuario';
          return;
        }

        // Opcional: iniciar sesión automáticamente
        // o solo redirigir al login
        window.location.href = 'login.html';
      } catch (err) {
        console.error(err);
        msg.textContent = 'Error de conexión con el servidor';
      }
    });
  </script>
</body>
</html>
