<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Anuncios UAB</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4" style="max-width: 400px; width: 100%;">
      <h1 class="h4 mb-3 text-center">Iniciar sesión</h1>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            required
            value="admin@uab.edu"
          >
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control"
            required
            value="123456"
          >
        </div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>
        <p id="loginMessage" class="mt-2 text-danger text-center"></p>
      </form>

      <a href="index.html" class="d-block text-center mt-3">Volver a los anuncios</a>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const messageEl = document.getElementById('loginMessage');
      messageEl.textContent = '';

      try {
        const resp = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await resp.json();

        if (!resp.ok || !data.success) {
          messageEl.textContent = data.message || 'Credenciales inválidas';
          return;
        }

        // Guardar token y rol en localStorage
        localStorage.setItem('token', data.token);
        localStorage.setItem('rol', data.usuario.rol);

        // Volver a la página principal
        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        messageEl.textContent = 'Error de conexión con el servidor';
      }
    });
  </script>
</body>
</html>
